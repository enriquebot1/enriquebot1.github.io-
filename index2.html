<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search History</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400&display=swap');

  :root {
    --bg: #ffffff;
    --surface: #f7f7f7;
    --border: #e0e0e0;
    --text-dim: #aaa;
    --text-mid: #777;
    --text: #333;
    --text-bright: #111;
    --accent: #2266cc;
    --accent-dim: #ccdcf8;
    --red: #cc2222;
    --yellow: #a07010;
    --green: #2a6e38;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ─── BROWSER CHROME ─── */
  #browser {
    max-width: 900px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #titlebar {
    background: #f0f0f0;
    border-bottom: 1px solid #ddd;
    padding: 10px 16px 0;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  #traffic-lights {
    display: flex;
    gap: 7px;
    margin-bottom: 10px;
    padding-top: 2px;
  }
  .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    opacity: 0.7;
  }
  .dot-red { background: #ff5f57; }
  .dot-yellow { background: #febc2e; }
  .dot-green { background: #28c840; }

  #tabs {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  #tabs::-webkit-scrollbar { display: none; }

  .tab {
    background: #e4e4e4;
    border: 1px solid #d0d0d0;
    border-bottom: none;
    padding: 6px 14px;
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    border-radius: 6px 6px 0 0;
    cursor: default;
    transition: all 0.3s;
    font-family: var(--mono);
  }
  .tab.active {
    background: var(--surface);
    color: var(--text-mid);
    border-color: #d0d0d0;
  }
  .tab.new { opacity: 0; animation: tabAppear 0.4s ease forwards; }

  @keyframes tabAppear {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #addressbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #url-display {
    flex: 1;
    background: #ececec;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .lock-icon { color: #3a7d44; font-size: 10px; }
  #clock {
    font-size: 11px;
    color: var(--text-dim);
    min-width: 130px;
    text-align: right;
  }

  /* ─── MAIN CONTENT ─── */
  #content {
    flex: 1;
    padding: 0;
  }

  /* ─── HEADER ─── */
  #archive-header {
    padding: 40px 40px 30px;
    border-bottom: 1px solid #e8e8e8;
  }

  .archive-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  #archive-header h1 {
    font-size: 22px;
    font-weight: 300;
    color: var(--text-bright);
    margin-bottom: 4px;
  }

  .archive-meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 12px;
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }

  .meta-item span { color: var(--text-mid); }

  /* ─── SEARCH ENTRIES ─── */
  #entries {
    padding: 0 40px 80px;
  }

  .phase-divider {
    padding: 32px 0 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    opacity: 0;
    transition: opacity 0.8s;
  }
  .phase-divider.visible { opacity: 1; }
  .divider-line { flex: 1; height: 1px; background: #e0e0e0; }
  .divider-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .entry {
    display: flex;
    align-items: flex-start;
    gap: 0;
    padding: 0;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.5s, transform 0.5s;
    border-bottom: 1px solid transparent;
  }
  .entry.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .entry:hover {
    background: #f5f5f5;
  }

  .entry-time {
    min-width: 160px;
    padding: 14px 0;
    font-size: 11px;
    color: var(--text-dim);
    font-style: italic;
    flex-shrink: 0;
  }

  .entry-body {
    flex: 1;
    padding: 12px 0 12px 24px;
    border-left: 1px solid #e0e0e0;
  }

  .entry-query {
    font-size: 14px;
    color: var(--text);
    font-weight: 400;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .entry-query.deleted {
    text-decoration: line-through;
    color: var(--text-dim);
    font-style: italic;
  }

  .entry-query.deleted::after {
    content: '[DELETED]';
    font-size: 10px;
    color: var(--red);
    text-decoration: none;
    opacity: 0.6;
    font-style: normal;
  }

  .entry-query.repeat-marker {
    color: var(--yellow);
  }

  .entry-query.late-night {
    color: #8888cc;
  }

  .entry-query.final {
    color: var(--text-bright);
    font-size: 16px;
  }

  .entry-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 3px;
    font-style: italic;
  }

  .entry-autocomplete {
    margin-top: 6px;
    padding: 6px 10px;
    background: #efefef;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .autocomplete-item {
    padding: 3px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .autocomplete-item::before {
    content: '↑';
    color: var(--text-dim);
    opacity: 0.4;
    font-size: 10px;
  }
  .ac-hl { color: var(--text-mid); }

  /* ─── PHASE STYLES ─── */
  .phase-1 .entry-query { color: #7a8fa8; }
  .phase-2 .entry-query { color: #5577aa; }
  .phase-3 .entry-query { color: #334488; }
  .phase-4 .entry-query { color: #993333; }
  .phase-5 .entry-query { color: var(--text-bright); }

  /* ─── GAP INDICATOR ─── */
  .time-gap {
    padding: 20px 0 20px 160px;
    border-left: none;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .time-gap.visible { opacity: 1; }
  .gap-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-left: 24px;
    border-left: 1px solid #e0e0e0;
  }
  .gap-dots { color: #ccc; letter-spacing: 4px; }
  .gap-label { font-size: 10px; color: var(--text-dim); font-style: italic; }

  /* ─── GLITCH ─── */
  @keyframes glitch {
    0%, 94%, 100% { transform: none; opacity: 1; }
    95% { transform: translateX(-2px); opacity: 0.8; clip-path: inset(20% 0 60% 0); }
    97% { transform: translateX(2px); opacity: 0.9; clip-path: inset(60% 0 10% 0); }
    99% { transform: none; opacity: 0.85; }
  }

  .glitch { animation: glitch 8s infinite; }

  /* ─── CURSOR ─── */
  #cursor-blink {
    display: inline-block;
    width: 9px;
    height: 16px;
    background: var(--text);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 1.1s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* ─── FINAL ENTRY ─── */
  #final-entry {
    padding: 40px 0 20px;
    opacity: 0;
    transition: opacity 1.5s;
  }
  #final-entry.visible { opacity: 1; }

  #final-query {
    font-size: 20px;
    font-weight: 300;
    color: var(--text-bright);
    font-family: var(--mono);
    padding: 20px 0 20px 24px;
    border-left: 1px solid #bbb;
  }

  #final-timestamp {
    font-size: 11px;
    color: var(--text-dim);
    font-style: italic;
    margin-bottom: 8px;
  }

  /* ─── FOOTER STATIC ─── */
  #static-footer {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ff4a4a22, transparent);
    animation: scanline 4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes scanline {
    0%, 100% { opacity: 0; top: 100%; }
    50% { opacity: 1; top: 0%; }
  }

  /* ─── NOTIFICATION ─── */
  .notif {
    position: fixed;
    top: 80px;
    right: 24px;
    background: #f7f7f7;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 11px;
    color: var(--text-dim);
    max-width: 200px;
    opacity: 0;
    transform: translateX(20px);
    transition: all 0.4s;
    z-index: 200;
    pointer-events: none;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .notif.show { opacity: 1; transform: translateX(0); }
  .notif-title { font-weight: 500; color: var(--text-mid); margin-bottom: 2px; }

  /* ─── REDACTION ─── */
  .redacted {
    background: var(--text-dim);
    color: transparent;
    border-radius: 2px;
    user-select: none;
  }

  /* ─── REPEAT BADGE ─── */
  .repeat-badge {
    font-size: 9px;
    background: #fce8e8;
    color: var(--red);
    border: 1px solid #f0c0c0;
    border-radius: 3px;
    padding: 1px 5px;
    letter-spacing: 0.05em;
  }

  /* ─── SCROLL PROGRESS ─── */
  #progress {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    background: #aac4ee;
    transition: width 0.1s;
    z-index: 999;
  }

  /* ─── INTRO OVERLAY ─── */
  #intro {
    position: fixed;
    inset: 0;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    gap: 16px;
    transition: opacity 0.8s;
  }
  #intro.hide { opacity: 0; pointer-events: none; }

  #intro p {
    font-size: 11px;
    color: #aaa;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    line-height: 2;
  }
  #intro p b { color: #888; font-weight: 400; }

  #intro-title {
    font-size: 13px;
    color: #999;
    font-style: italic;
    text-align: center;
    max-width: 300px;
    line-height: 1.8;
  }

  #open-btn {
    margin-top: 24px;
    background: none;
    border: 1px solid #ccc;
    color: #999;
    padding: 10px 28px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s;
    border-radius: 2px;
  }
  #open-btn:hover {
    border-color: #999;
    color: #555;
  }

  #warning-text {
    font-size: 10px;
    color: #ccc;
    text-align: center;
    line-height: 2;
    max-width: 360px;
  }
</style>
</head>
<body>

<div id="progress"></div>
<div id="static-footer"></div>

<!-- INTRO OVERLAY -->
<div id="intro">
  <p><b>RECOVERED DATA</b><br><br>device: iPhone 16<br></p>

// ─── BUILD ENTRIES ───────────────────────────────────────────
function buildEntries() {
  const container = document.getElementById('entries');
  let count = 0;

  phases.forEach((phase, pi) => {
    // Gap indicator
    if (phase.gap) {
      const gap = document.createElement('div');
      gap.className = 'time-gap';
      gap.innerHTML = `<div class="gap-bar"><span class="gap-dots">· · · · · · ·</span><span class="gap-label">${phase.gap}</span></div>`;
      container.appendChild(gap);
    }

    // Phase divider
    const div = document.createElement('div');
    div.className = 'phase-divider';
    div.innerHTML = `<div class="divider-line"></div><div class="divider-label">${phase.label}</div><div class="divider-line"></div>`;
    container.appendChild(div);

    // Entries
    phase.entries.forEach(e => {
      count++;
      const el = document.createElement('div');
      el.className = `entry phase-${phase.id}`;
      el.dataset.phase = phase.id;

      let qClass = 'entry-query';
      if (e.deleted) qClass += ' deleted';
      if (e.repeat) qClass += ' repeat-marker';
      if (e.late) qClass += ' late-night';
      if (e.final) qClass += ' final';

      let extraBadge = '';
      if (e.repeat) extraBadge = `<span class="repeat-badge">×again</span>`;

      let subLine = '';
      if (e.late && !e.deleted) subLine = `<div class="entry-sub">late night · private window</div>`;

      let autocompleteHtml = '';
      if (e.autocomplete) {
        autocompleteHtml = `<div class="entry-autocomplete">`;
        e.autocomplete.forEach(ac => {
          const hl = ac.startsWith(e.q) ? `<span class="ac-hl">${e.q}</span>${ac.slice(e.q.length)}` : ac;
          autocompleteHtml += `<div class="autocomplete-item">${hl}</div>`;
        });
        autocompleteHtml += `</div>`;
      }

      el.innerHTML = `
        <div class="entry-time">${e.time}</div>
        <div class="entry-body">
          <div class="${qClass}">${e.q}${extraBadge}</div>
          ${subLine}
          ${autocompleteHtml}
        </div>
      `;
      container.appendChild(el);
    });
  });

  // Final unfinished entry
  const finalEl = document.createElement('div');
  finalEl.id = 'final-entry';
  finalEl.innerHTML = `
    <div class="entry-time" style="padding-left:0; padding-top:40px; color:#444; font-size:11px; font-style:italic;">Oct 19, 2026 · 6:02 AM</div>
    <div id="final-query">how do i know if<span id="cursor-blink"></span></div>
  `;
  container.appendChild(finalEl);

  totalEntries = count;
  document.getElementById('total-count').textContent = count.toLocaleString() + ' queries';
}

// ─── INTERSECTION OBSERVER ───────────────────────────────────
function setupObserver() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

  document.querySelectorAll('.entry, .phase-divider, .time-gap, #final-entry').forEach(el => {
    observer.observe(el);
  });
}

// ─── SCROLL PROGRESS ─────────────────────────────────────────
function setupScrollProgress() {
  const bar = document.getElementById('progress');
  window.addEventListener('scroll', () => {
    const scrolled = window.scrollY;
    const total = document.body.scrollHeight - window.innerHeight;
    const pct = total > 0 ? (scrolled / total) * 100 : 0;
    bar.style.width = pct + '%';
  });
}

// ─── CLOCK ───────────────────────────────────────────────────
function startClock() {
  const el = document.getElementById('clock');
  // Show a fake "now" that slowly ticks, matching the late-night theme
  let fakeHour = 3, fakeMin = 0, fakeSec = 0;
  function tick() {
    fakeSec++;
    if (fakeSec >= 60) { fakeSec = 0; fakeMin++; }
    if (fakeMin >= 60) { fakeMin = 0; fakeHour = (fakeHour + 1) % 24; }
    const h = String(fakeHour).padStart(2, '0');
    const m = String(fakeMin).padStart(2, '0');
    const s = String(fakeSec).padStart(2, '0');
    el.textContent = `archive · ${h}:${m}:${s}`;
  }
  tick();
  setInterval(tick, 1000);
}

// ─── NOTIFICATIONS ───────────────────────────────────────────
function scheduleNotifs() {
  notifications.forEach(n => {
    setTimeout(() => showNotif(n.title, n.body), n.delay);
  });
}

function showNotif(title, body) {
  const el = document.getElementById('notif');
  document.getElementById('notif-title').textContent = title;
  document.getElementById('notif-body').textContent = body;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4000);
}

// ─── EXTRA TABS ───────────────────────────────────────────────
function scheduleTabs() {
  extraTabs.forEach(t => {
    setTimeout(() => {
      const tabs = document.getElementById('tabs');
      const tab = document.createElement('div');
      tab.className = 'tab new';
      tab.textContent = t.label;
      tabs.appendChild(tab);
    }, t.delay);
  });
}

// ─── GLITCH ON PHASE 4 ────────────────────────────────────────
function setupGlitch() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        document.body.style.setProperty('--glitch-active', '1');
        document.querySelectorAll('.phase-4 .entry-query').forEach(el => {
          el.classList.add('glitch');
        });
      }
    });
  }, { threshold: 0.1 });

  const phase4 = document.querySelector('[data-phase="4"]');
  if (phase4) observer.observe(phase4);
}

// ─── OPEN ARCHIVE ─────────────────────────────────────────────
function openArchive() {
  if (opened) return;
  opened = true;

  const intro = document.getElementById('intro');
  intro.classList.add('hide');
  setTimeout(() => intro.style.display = 'none', 900);

  startClock();
  scheduleNotifs();
  scheduleTabs();
  setTimeout(setupObserver, 500);
  setTimeout(setupGlitch, 500);
}

// ─── INIT ─────────────────────────────────────────────────────
buildEntries();
setupScrollProgress();
</script>
